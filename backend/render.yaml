services:
  - type: web
    name: todo-app-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: "*"
      # Secrets — left unset here on purpose. Render will prompt for these
      # in the dashboard when the Blueprint is deployed, and they're stored
      # only on Render's side, never committed to the repo.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: TOKEN_HASH_SECRET
        sync: false
